<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Janardan Pal — Marketing instinct. Builder mindset.</title><desc id="desc">A warm ivory portfolio cover with coral, sage and blue dimensional cards representing apps, growth and useful products. Based in Lucknow, India.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#faf9f2"/><stop offset="1" stop-color="#e7efdf"/></linearGradient><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#f8b29e"/><stop offset="1" stop-color="#de765d"/></linearGradient><linearGradient id="sage" x2="1" y2="1"><stop stop-color="#e1edc8"/><stop offset="1" stop-color="#a9c48e"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#d8eef3"/><stop offset="1" stop-color="#9dc6d3"/></linearGradient><filter id="shadow" x="-40%" y="-40%" width="190%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#2b4132" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="440" rx="26" fill="url(#bg)"/>
<circle cx="970" cy="215" r="175" fill="none" stroke="#cddac2"/><ellipse cx="970" cy="215" rx="220" ry="125" transform="rotate(-26 970 215)" fill="none" stroke="#cddac2"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="54" y="40" width="42" height="42" rx="12" fill="#253d31"/><text x="65" y="68" font-size="19" fill="#f4f6e9" font-weight="700">JP</text><text x="112" y="66" font-size="13" fill="#50664f" letter-spacing="2">MARKETER / INDIE BUILDER</text>
<text x="54" y="166" font-size="65" fill="#253d31" font-weight="700" letter-spacing="-3">Janardan Pal.</text>
<text x="56" y="220" font-size="34" fill="#253d31" letter-spacing="-1">Marketing instinct.</text><text x="56" y="265" font-size="34" fill="#cc684f" letter-spacing="-1">Builder mindset.</text>
<text x="57" y="314" font-size="17" fill="#64755e">Connecting people, products, and everyday possibilities.</text>
<circle cx="63" cy="385" r="5" fill="#819d65"/><text x="78" y="390" font-size="12" fill="#51664b" letter-spacing="1.3">LUCKNOW, INDIA</text><text x="270" y="390" font-size="12" fill="#51664b" letter-spacing="1.3">OPEN TO HYBRID + REMOTE WORK</text>
<g transform="translate(770 82) rotate(-12 75 100)" filter="url(#shadow)"><rect x="5" y="7" width="155" height="202" rx="20" fill="#c9715b"/><rect width="155" height="202" rx="20" fill="url(#coral)"/><rect x="22" y="25" width="45" height="45" rx="12" fill="#fff5e7" opacity=".8"/><path d="M35 36h18v23H35zM39 42h10m-10 5h10m-10 5h7" stroke="#a95743" fill="none" stroke-width="2"/><text x="22" y="111" font-size="25" fill="#493b2c" font-weight="700">Build.</text><text x="22" y="139" font-size="12" fill="#654b3a">Apps for real life.</text><path d="M22 172h103" stroke="#af5f49" opacity=".4"/></g>
