<g transform="translate(867 272) rotate(-5 100 45)" filter="url(#shadow)"><rect x="2" y="6" width="230" height="94" rx="18" fill="#8fb5c1"/><rect width="230" height="94" rx="18" fill="url(#blue)"/><circle cx="36" cy="47" r="17" fill="#eaf4ed"/><path d="m28 47 6 6 11-12" stroke="#547667" fill="none" stroke-width="3" stroke-linecap="round"/><text x="66" y="43" font-size="18" fill="#2d4d50" font-weight="700">Make it useful.</text><text x="66" y="64" font-size="11" fill="#516f6e">Then keep making it better.</text></g></g></svg>